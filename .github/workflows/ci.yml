name: CI

# Runs on every push and every pull request. This is the gate the project has
# never had: 131 tests cover the order-integrity, rate-limit, delivery-promise
# and sale-scope fixes, and until now nothing stopped a change from quietly
# undoing them.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  # a new push to the same branch cancels the run in flight
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the Node version the production host actually runs.
  # Next.js 16 requires 20.9 or newer.
  NODE_VERSION: "22.x"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` on Linux, which is the point: a lockfile written by a plain
      # `npm install` on Windows drops the platform-gated optional packages.
      # If this step fails with "Missing: <pkg> from lock file", run
      # `npm run lock:fix` locally and commit the regenerated package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and regression tests
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Six routes are prerendered by `next build` and query MongoDB, so the
      # build genuinely needs a reachable database. Fail with a sentence that
      # says what to do rather than a stack trace from Mongoose.
      #
      # Reports every secret and variable the job can see, so a missing one is
      # distinguishable from a mis-scoped one at a glance. Only presence and
      # length are printed — never a value. GitHub masks secrets in logs, but
      # this step is written so there is nothing to mask in the first place.
      - name: Check build secrets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          VAR_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          VAR_APP_PATH: ${{ vars.CPANEL_APP_PATH }}
        run: |
          report() {
            if [ -n "$2" ]; then
              printf '  %-22s present (%s chars)\n' "$1" "${#2}"
            else
              printf '  %-22s MISSING\n' "$1"
            fi
          }
          echo "Secrets visible to this job:"
          report "MONGODB_URI"           "$MONGODB_URI"
          report "AUTH_SECRET"           "$AUTH_SECRET"
          report "FTP_SERVER"            "$FTP_SERVER"
          report "FTP_USERNAME"          "$FTP_USERNAME"
          report "FTP_PASSWORD"          "$FTP_PASSWORD"
          echo "Variables visible to this job:"
          report "NEXT_PUBLIC_SITE_URL"  "$VAR_SITE_URL"
          report "CPANEL_APP_PATH"       "$VAR_APP_PATH"

          if [ -z "$MONGODB_URI" ]; then
            echo "::error::MONGODB_URI is empty in this job. The build prerenders six routes that query MongoDB, so it cannot run without one."
            echo "If the list above shows every secret as MISSING, they are scoped somewhere this job cannot read:"
            echo "  - they were added under Dependabot or Codespaces rather than Actions, or"
            echo "  - they are Environment secrets on an environment this job does not declare, or"
            echo "  - they were added to a different repository."
            echo "Repository secrets live at Settings -> Secrets and variables -> Actions -> Secrets tab -> Repository secrets."
            echo "If only MONGODB_URI is MISSING, the name does not match exactly - it is case-sensitive."
            exit 1
          fi

          case "$MONGODB_URI" in
            mongodb://*|mongodb+srv://*) ;;
            *)
              echo "::error::MONGODB_URI does not start with mongodb:// or mongodb+srv://. Paste the driver connection string from Atlas -> Connect -> Drivers, with <password> replaced."
              exit 1
              ;;
          esac

      - name: Build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          # Inlined into the client bundle at build time, so it has to be the
          # real public URL here — it cannot be corrected at runtime.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NODE_ENV: production
        run: npm run build

      # The standalone output is the whole deployable: server.js plus only the
      # node_modules Next actually traced as reachable. Keeping it as an
      # artifact means a deploy job never has to rebuild.
      - name: Package standalone output
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then cp -r public deploy/public; fi
          echo "${{ github.sha }}" > deploy/BUILD_SHA
          du -sh deploy

      # `next start` reads .next/BUILD_ID first and dies with "Could not find a
      # production build in the './.next' directory" if it is absent, which on
      # cPanel surfaces only as an Apache 503. Fail here, where the message is
      # readable, rather than on the server.
      - name: Verify the package is complete
        run: |
          missing=0
          for path in .next/BUILD_ID .next/server .next/static server.js package.json; do
            if [ -e "deploy/$path" ]; then
              echo "  ok       $path"
            else
              echo "  MISSING  $path"
              missing=1
            fi
          done
          echo "deploy/ holds $(find deploy -type f | wc -l) files"
          if [ "$missing" = "1" ]; then
            echo "::error::The deploy package is incomplete. Do not ship it."
            exit 1
          fi

      # include-hidden-files is NOT optional. Since v4.4 this action excludes
      # every path beginning with a dot, and it does so silently — which drops
      # the whole of .next and produces an artifact that looks fine, deploys
      # fine, and then cannot start. See actions/upload-artifact#602.
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ github.sha }}
          path: deploy
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: build
    # only the main branch ships, and only on a real push — never from a PR
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone-${{ github.sha }}
          path: deploy

      # The same check again on the other side of the artifact round-trip: the
      # upload is where .next went missing before, so prove it survived rather
      # than spending 14 minutes uploading a package that cannot boot.
      - name: Verify the downloaded package is complete
        run: |
          missing=0
          for path in .next/BUILD_ID .next/server .next/static server.js package.json; do
            if [ -e "deploy/$path" ]; then
              echo "  ok       $path"
            else
              echo "  MISSING  $path"
              missing=1
            fi
          done
          echo "deploy/ holds $(find deploy -type f | wc -l) files"
          if [ "$missing" = "1" ]; then
            echo "::error::The artifact lost files in transit. Nothing was uploaded to the server."
            exit 1
          fi

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Why not SamKirkland/FTP-Deploy-Action: it uploads strictly one file at
      # a time. A Next.js standalone build with every product prerendered is
      # ~9,500 files, and FTP costs a round trip per file — the first deploy
      # measured 80 kB/s with 3m42s spent purely on "changing dirs", and a
      # later one took over half an hour. The bottleneck is latency, not
      # bandwidth, so the fix is concurrency: `mirror --parallel` opens several
      # transfers at once and the round trips overlap.
      #
      # If the host answers "421 Too many connections", lower PARALLEL to 4.
      # Shared cPanel plans commonly cap concurrent FTP sessions per IP at 8.
      - name: Upload over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.CPANEL_APP_PATH }}
          PARALLEL: "8"
        run: |
          echo "Uploading $(find deploy -type f ! -path 'deploy/tmp/*' | wc -l) files with $PARALLEL parallel transfers…"
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            # Shared cPanel hosts present the server's own certificate, not one
            # for ftp.<yourdomain>, so verification cannot succeed. The channel
            # is still encrypted — the credential is never sent in clear — it
            # is simply not authenticated. Everything being shipped here is a
            # public website build.
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set net:timeout 20;
            set mirror:parallel-transfer-count $PARALLEL;
            set cmd:fail-exit true;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror --reverse --continue --no-perms --parallel=$PARALLEL \
                   --exclude '(^|/)\.git(/|\$)' \
                   --exclude '(^|/)node_modules/\.cache(/|\$)' \
                   --exclude '(^|/)tmp(/|\$)' \
                   ./deploy/ \"$REMOTE_DIR\";
            bye
          "

      # Deliberately after the mirror, and on its own. Passenger restarts the
      # app the moment this file's timestamp changes, so uploading it inside a
      # parallel transfer could restart onto a half-written tree — the mirror
      # excludes tmp/ for exactly this reason. With no SSH this is the only way
      # to restart from CI; cPanel → Node.js → Restart does the same by hand.
      - name: Stamp the restart trigger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.CPANEL_APP_PATH }}
        run: |
          mkdir -p deploy/tmp
          echo "restarted for ${{ github.sha }} at $(date -u +%FT%TZ)" > deploy/tmp/restart.txt
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate no;
            set cmd:fail-exit true;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mkdir -p \"$REMOTE_DIR/tmp\";
            put -O \"$REMOTE_DIR/tmp\" deploy/tmp/restart.txt;
            bye
          "
          echo "Restart trigger stamped. Passenger will reload on the next request."

      - name: Confirm the app is answering
        run: |
          echo "Waiting for Passenger to pick up the restart…"
          sleep 25
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ vars.NEXT_PUBLIC_SITE_URL }}/api/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Health check passed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt: /api/health returned $code. Retrying in 15s…"
            sleep 15
          done
          echo "::error::/api/health never returned 200. The upload succeeded but the app is not serving."
          echo "Check cPanel → Node.js → your app for the startup log, then Restart it by hand."
          exit 1
